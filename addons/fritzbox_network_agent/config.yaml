name: "FRITZ!Box Network Diagnostic"
version: "0.1.0"
slug: "fritzbox_network_agent"
description: "Smart FRITZ!Box + Powerline diagnostics powered by fritzbox-mcp-server"
url: "https://github.com/kambriso/fritzbox-mcp-server"
startup: services
boot: auto
init: false
arch:
  - amd64
  - aarch64
ingress: true
ingress_port: 8099
panel_icon: mdi:router-wireless
panel_title: FRITZ Diagnostics
homeassistant_api: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Flask dashboard (optional if using Ingress only)
map:
  - addon_config:rw
  - ssl
options:
  fritz_host: 192.168.178.1
  fritz_port: 49000
  fritz_username: ""
  fritz_password: ""
  ha_url: "http://supervisor/core"
  ha_token: ""
  auto_refresh_seconds: 30
schema:
  fritz_host: str
  fritz_port: port
  fritz_username: str?
  fritz_password: password?
  ha_url: str
  ha_token: password?
  auto_refresh_seconds: int(10,300)
